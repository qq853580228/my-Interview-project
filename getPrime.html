<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
    function getPrime(n) {
      const arr = []
      for (let i = 1; i <= n; i++) {
        if (i === 1) {
          continue;
        }
        let isNotPrime = false
        for (let j = 2; j <= Math.sqrt(i); j++) {
          if (i % j === 0) {
            isNotPrime = true
            break;
          }
        }
        if (!isNotPrime) {
          arr.push(i)
        }
      }
      return arr;
    }
    console.log(getPrime(100));
  </script>
</body>
</html>
